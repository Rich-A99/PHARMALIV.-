<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHARMALIV - Pharmacie en ligne & Livraison Grand Libreville</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16A34A"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn-checkout.cinetpay.com/seamless/main.js"></script>
<style>
:root{--g:#16A34A;--gd:#166534;--ink:#1F2937;--bg:#FFFFFF;--bg2:#F8FAFC;--line:#E2E8F0;--mut:#64748B;--warn:#B45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#E5E7EB;--bg:#111827;--bg2:#1F2937;--line:#374151;--mut:#9CA3AF}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg2);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-size:22px;color:var(--ink);display:flex;align-items:center;gap:8px}.mark{height:40px;width:auto;border-radius:8px;background:#fff}.logo b{font-weight:800}.logo span{font-weight:300;color:var(--g)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:100%}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 14px Montserrat,sans-serif;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gd);border-color:var(--gd);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
.banner{background:var(--gd);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}footer{background:#1F2937;color:#fff;margin-top:24px;padding:20px 16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13px;text-align:center}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
button.pri,button.sec{font:700 14px Montserrat,sans-serif;border-radius:8px;padding:10px 16px;cursor:pointer;border:0}
button.pri{background:var(--g);color:#fff}button.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.prod{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.prod .ph{font-size:34px}.prod.out{opacity:.55}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--g);color:#fff}
.badge.r{background:var(--warn)}.badge.m{background:var(--mut)}.badge.b{background:#2563EB}.badge.x{background:#DC2626}
.code{font-size:56px;font-weight:800;color:var(--gd);letter-spacing:1px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .code{color:#4ADE80}}
.steps{display:flex;gap:4px;margin:10px 0}
.steps div{flex:1;text-align:center;font-size:12px;padding:8px 2px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--mut)}
.steps div.d{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.stat{font-size:26px;font-weight:800;color:var(--g)}
.note{font-size:13px;color:var(--mut)}
.toast{background:var(--bg);border-left:4px solid var(--g);border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:13px}
svg.map{width:100%;height:auto;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.ocr{background:var(--bg2);border:1px dashed var(--g);border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes sweep{from{top:0}to{top:calc(100% - 4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #16A34A66}50%{box-shadow:0 0 0 10px #16A34A00}}
@keyframes rot{to{transform:rotate(360deg)}}
main>*{animation:rise .35s ease both}
header{background:linear-gradient(90deg,var(--bg),#16A34A18)}
.banner{background:linear-gradient(120deg,var(--gd),var(--g))}
.card{transition:box-shadow .2s}.card:hover{box-shadow:0 6px 18px #16A34A22}
.prod{position:relative;transition:transform .2s}.prod:hover{transform:translateY(-4px)}
.art{width:100%;height:92px;border-radius:8px}td .art{width:44px;height:40px;vertical-align:middle}
.flash{animation:pulse 1.2s infinite;border-color:var(--g)}
.drop{position:relative;border:2px dashed var(--g);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--mut);transition:background .2s}
.drop:hover{background:#16A34A12}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0}
.scan{position:relative;overflow:hidden;border-radius:10px;max-width:220px;margin:6px 0}.scan img{width:100%;display:block}
.scan i{position:absolute;left:0;right:0;height:4px;background:#16A34A;box-shadow:0 0 14px 4px #16A34A;animation:sweep .8s ease-in-out infinite alternate}
.ov{position:fixed;inset:0;background:#000A;display:grid;place-items:center;z-index:20;padding:16px;animation:pop .2s both;overflow:auto}
.modal{background:var(--bg);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center;animation:pop .3s both}
.spin{width:54px;height:54px;border:5px solid var(--line);border-top-color:var(--g);border-radius:50%;margin:14px auto;animation:rot 1s linear infinite}
.ok{font-size:54px;animation:pop .4s both}.steps div{transition:background .4s}
.mapslot{border-radius:10px;overflow:hidden;position:relative}
</style></head><body>
<header><div class="logo"><img class="mark" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAB5AFwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/" alt="" width="31" height="40"><b>PHARMA</b><span>LIV</span></div>
<nav id="nav"></nav><span id="acct"></span><span id="srv" class="badge m">CinetPay Demo</span><button class="sec" onclick="reset()">Réinitialiser</button></header>
<main id="app"></main>
<footer id="foot"></footer>
<script>
const Z=[["Libreville (Centre, Nzeng-Ayong, PK9, Petit Paris)",2000],["Owendo",2500],["Akanda (Angondjé, Sablière, Delta)",3000],["Essassa",3500],["Ntoum",4000]];
const ROLES=[["client","Client"],["pharma","Pharmacie"],["livreur","Livreur"],["admin","Admin"]];
const seed=()=>({day:today(),n:0,orders:[],tx:[],notifs:[],wallet:0,wd:[],users:[
  {id:"u-ph",role:"pharma",name:"Pharmacie du Centre",phone:"077000001",pin:"1234",momo:"077000001",momoOp:"Airtel Money",wallet:0,status:"approved"},
  {id:"u-lv",role:"livreur",name:"Brice O.",phone:"077000002",pin:"1234",momo:"077000002",momoOp:"Airtel Money",wallet:0,status:"approved"},
  {id:"u-ad",role:"admin",name:"PHARMALIV HQ",phone:"077000003",pin:"1234",momo:"077000003",momoOp:"Airtel Money",wallet:0,status:"approved"}
],me:{pharma:"u-ph",livreur:"u-lv",admin:"u-ad"},init:1,brand:{logo:"",c1:"#16A34A",c2:"#166534",c3:"#1F2937",title:"Vos médicaments à domicile dans le Grand Libreville.",sub:"Commande rapide, paiement Airtel Money ou Moov Money via CinetPay.",promo:""},
products:[
  [1,"Paracétamol 500 mg",'Médicaments',1200,300,"💊",1,1],
  [2,"Amoxicilline 1 g",'Médicaments',3500,700,"💊",1,1],
  [3,"Sirop contre la toux",'Médicaments',2800,560,"🧪",1,0],
  [4,"Sérum physiologique",'Parapharmacie',1500,0,"💧",1,0],
  [5,"Crème hydratante",'Parapharmacie',6500,0,"🧴",1,0],
  [6,"Vitamine C 1000",'Parapharmacie',4200,0,"🍊",0,0],
  [7,"Thermomètre digital",'Parapharmacie',3800,0,"🌡️",1,0],
  [8,"Masques chirurgicaux x50",'Parapharmacie',2500,0,"😷",1,0]
].map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],tm:a[4],pic:a[5],stock:!!a[6],rx:!!a[7]}))});

function today(){return new Date().toISOString().slice(0,10)}
let S;try{S=JSON.parse(localStorage.getItem("pl2")||"null")}catch(e){S=null}S=S||seed();S.users=S.users||seed().users;S.me=S.me||{};S.brand=S.brand||seed().brand;if(!S.users.some(u=>u.role==="admin"))S.users.push(seed().users[2]);S.users.forEach(u=>{if(u.role!=="client"&&!u.momo){u.momo=u.phone;u.momoOp="Airtel Money";if(!u.status)u.status="approved"}});if(!S.init){S.init=1;["pharma","livreur","admin"].forEach(r=>{const u=S.users.find(x=>x.role===r);if(u)S.me[r]=u.id})}

function save(){try{localStorage.setItem("pl2",JSON.stringify(S))}catch(e){}DIRTY=true;if(SRV)push()}
function reset(){if(confirm("Effacer toutes les données ?")){S=seed();cart={};ocr=null;save();go("client")}}

let role="client",cart={},ocr=null,insuranceMode="none",hasPrescription=false,lastSeen=0,tab="orders",cur=null,SRV=null,ADM="",editId=null,pend=null,ME=null,AUTH="login",CA=false,RS=null,AT="dash",DIRTY=false,GW=null;
const $=s=>document.querySelector(s),f=n=>n.toLocaleString("fr-FR")+" FCFA",esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function notif(to,msg){S.notifs.unshift({to,msg,t:new Date().toLocaleTimeString("fr-FR")});S.notifs=S.notifs.slice(0,30)}
function nextCode(){if(S.day!==today()){S.day=today();S.n=0}S.n++;return"#P"+String(S.n).padStart(3,"0")}
function go(r){role=r;CA=false;render()}
const LOGO=document.querySelector(".mark").src,mk=h=>`<img class="mark" src="${S.brand.logo||LOGO}" alt="" style="height:${h}px">`;
function toasts(r){return S.notifs.filter(n=>n.to===r).slice(0,3).map(n=>`<div class="toast">${esc(n.t)} · ${esc(n.msg)}</div>`).join("")}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}

function render(){
 $("#nav").innerHTML=ROLES.map(r=>`<button class="${r[0]===role?"on":""}" onclick="go('${r[0] ?? ''}')">${r[1]}</button>`).join("");
 ME=S.me&&S.me[role]?S.users.find(u=>u.id===S.me[role])||null:null;
 const B=S.brand,rs=document.documentElement.style;rs.setProperty("--g",B.c1);rs.setProperty("--gd",B.c2);if(!(typeof matchMedia==="function"&&matchMedia("(prefers-color-scheme: dark)").matches))rs.setProperty("--ink",B.c3);document.querySelector("header .mark").src=B.logo||LOGO;
 if(MH)document.body.appendChild(MH);
 $("#app").innerHTML=RS?resetView():role==="client"?(CA&&!ME?authView("client"):vClient()):ME?(role==="admin"?vAdmin():role==="pharma"?vPharma():vLivreur()):authView(role);
 attachMap();
 if(role==="client"&&cur&&!SRV&&!RS){const o=S.orders.find(x=>x.id===cur);if(o&&o.status==="push"&&!o.shown){o.shown=true;setTimeout(()=>payUssd(o.id),400)}}
 $("#acct").innerHTML=ME?`<button class="sec" onclick="logout()">👤 ${esc(ME.name.split(" ")[0])} • Quitter</button>`:role==="client"?`<button class="pri" onclick="CA=true;AUTH='reg';render()">Mon compte</button>`:"";
 const sb=$("#srv");sb.className="badge "+(SRV?(SRV.mode==="live"?"":"r"):"m");sb.textContent=SRV?"Serveur connecté":"CinetPay Demo";
 $("#foot").innerHTML=mk(36)+'<div><b>PHARMA</b><span style="font-weight:300">LIV</span><br>Plateforme de livraison de médicaments dans le Grand Libreville</div>';
 if(role==="client"&&cur)bindClient();
}

/* ---------- CLIENT ---------- */
function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=S.products.find(x=>x.id==id);return s+p.price*q},0)}

function vClient(){
 const mine=cur&&S.orders.find(o=>o.id===cur);
 if(mine)return vTrack(mine);
 const zi=+($("#zone")?.value||(ME&&ME.zone)||0),fee=Z[zi][1],prods=cartTotal();
 return `<div class="banner">${mk(64)}<div><b>${esc(S.brand.title)}</b><br>${esc(S.brand.sub)}</div></div>${S.brand.promo?`<div class="card" style="border-color:var(--g);background:#16A34A14"><b>${esc(S.brand.promo)}</b></div>`:""}${ME?quick():""}
 
 <div class="card">
  <h2>1. Type de commande (Assurance vs Sans assurance)</h2>
  <div class="row">
    <button class="${insuranceMode==="assurance"?"pri":"sec"}" onclick="insuranceMode='assurance';render()">Avec assurance (CNAMGS / Mutuelle)</button>
    <button class="${insuranceMode!=="assurance"?"pri":"sec"}" onclick="insuranceMode='none';render()">Sans assurance (Cash)</button>
  </div>
  
  ${insuranceMode==="assurance"?`
    <div class="note" style="margin-top:10px">Veuillez téléverser votre ordonnance et votre carte d'assuré pour calcul du ticket modérateur.</div>
    <div class="row" style="margin-top:10px">
      <div class="grow"><label>Photo de l’ordonnance</label><div class="drop">Ajouter ordonnance<input type="file" accept="image/*" onchange="runOcr(this,'ord')"></div></div>
      <div class="grow"><label>Carte CNAMGS / Assuré</label><div class="drop">Ajouter carte assurance<input type="file" accept="image/*" onchange="runOcr(this,'card')"></div></div>
    </div>
    <div id="ocrbox">${ocr?ocrHtml():'<div class="note">Documents requis pour l\'assurance.</div>'}</div>
  `:`
    <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
      <label><b>Avez-vous une ordonnance pour vos médicaments (sans assurance) ?</b></label>
      <div class="row" style="margin-top:6px">
        <button class="${hasPrescription?"pri":"sec"}" onclick="hasPrescription=true;render()">Oui (J'ai une ordonnance)</button>
        <button class="${!hasPrescription?"pri":"sec"}" onclick="hasPrescription=false;render()">Non (Achat libre / Parapharmacie)</button>
      </div>
      ${hasPrescription?`
        <div style="margin-top:10px">
          <label>Photo de l'ordonnance (Cash)</label>
          <div class="drop">Glisser ou toucher pour ajouter l'ordonnance<input type="file" accept="image/*" onchange="runOcr(this,'ord')"></div>
        </div>
        <div id="ocrbox">${ocr?ocrHtml():'<div class="note">Téléversez votre ordonnance pour la préparation.</div>'}</div>
      `:''}
    </div>
  `}
 </div>

 <div class="card">
  <h2>2. Sélection des produits</h2>
  <div class="grid">${S.products.filter(p=>hasPrescription || insuranceMode==="assurance" || !p.rx).map(p=>`<div class="prod ${p.stock?"":"out"}">
    <span class="badge ${p.stock?"":"x"}" style="position:absolute;top:8px;right:8px">${p.stock?"Dispo":"Rupture"}</span>
    ${p.rx?'<span class="badge b" style="position:absolute;top:8px;left:8px">Ordonnance requis</span>':''}
    <div class="ph">${pc(p)}</div><b>${esc(p.name)}</b>
    <div class="note">${esc(p.cat)}</div>
    <div>${f(p.price)}</div>
    ${p.stock?`<div class="row" style="margin-top:6px"><button class="sec" onclick="qty(${p.id},-1)" aria-label="Retirer">−</button><b>${cart[p.id]||0}</b><button class="sec" onclick="qty(${p.id},1)" aria-label="Ajouter">+</button></div>`:'<span class="badge r">Rupture de stock</span>'}
  </div>`).join("")}</div>
 </div>

 <div class="card">
  <h2>3. Livraison & Paiement CinetPay</h2>
  <div class="row">
    <div class="grow"><label>Nom complet</label><input id="nm" value="${esc(ocr?.name||$("#nm")?.value||(ME&&ME.name)||"")}"></div>
    <div class="grow"><label>Téléphone Mobile Money</label><input id="ph" inputmode="tel" placeholder="074 00 00 00" value="${esc($("#ph")?.value||(ME&&ME.phone)||"")}"></div>
  </div>
  <label>Zone de livraison (Grand Libreville)</label>
  <select id="zone" onchange="render()">${Z.map((z,i)=>`<option value="${i}" ${i===zi?"selected":""}>Zone ${i+1} · ${z[0]} · ${f(z[1])}</option>`).join("")}</select>
  <label>Adresse / Quartier de livraison</label><input id="adr" placeholder="Ex: Nzeng-Ayong, derrière la pharmacie" value="${esc($("#adr")?.value||(ME&&ME.adr)||"")}">
  <label>Opérateur Mobile Money</label>
  <select id="op">${["Airtel Money Gabon","Moov Money Gabon"].map(o=>`<option ${o===($("#op")?.value||(ME&&ME.op)||"Airtel Money Gabon")?"selected":""}>${o}</option>`).join("")}</select>
  <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
  <div class="row">
    <span class="grow">Produits : ${f(prods)}<br>Frais de livraison : ${f(fee)}</span>
    <span class="stat">${f(prods+fee)}</span>
  </div>
  <button class="pri" style="width:100%;margin-top:12px" ${prods || hasPrescription || insuranceMode==="assurance"?"":"disabled"} onclick="pay()">Payer par Mobile Money (CinetPay)</button>
 </div>${ME?history():""}`;
}

function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render()}
function settle(o){const a=S.users.find(u=>u.role==="admin"),p=S.users.find(u=>u.role==="pharma");if(a)a.wallet=(a.wallet||0)+o.split.pl;if(p)p.wallet=(p.wallet||0)+o.split.pharm}
function markPaid(o,ref){o.status="paid";S.tx.unshift({t:new Date().toLocaleString("fr-FR"),id:o.id,op:o.op,total:o.total,...o.split,ref:ref||"CP"+Date.now().toString().slice(-7)});settle(o);notif("pharma",o.id+" : paiement CinetPay confirmé");notif("client","Paiement confirmé via Mobile Money • "+o.id);save();render()}

function payUssd(id){const o=S.orders.find(x=>x.id===id);if(o&&o.status==="push")ussd(o.op,o.phone,o.total,()=>markPaid(o),()=>{o.status="new";o.shown=false;notif("pharma",id+" : paiement annulé");save();render()})}
function pushCard(o){return `<div class="card" style="border-color:var(--g)"><span class="badge r">Paiement Mobile Money</span><p>Demande de ${f(o.total)} envoyée au ${esc(o.phone)} (${esc(o.op)}).</p>${SRV?'<p class="note">Validez le paiement sur votre téléphone.</p>':`<button class="pri" onclick="payUssd('${o.id}')">Simuler la validation Mobile Money</button>`}</div>`}

function ussd(op,ph,amt,ok,no){
  const m=/moov/i.test(op);
  const d=document.createElement("div");d.className="ov";d.id="ussd";
  d.innerHTML=`<div class="modal"><span class="badge" style="background:${m?"#0057B8":"#E4002B"}">CinetPay • ${esc(op)}</span><div class="spin"></div><h3>Guichet CinetPay</h3><p>PHARMALIV demande <b>${f(amt)}</b>. Saisissez votre code PIN (numéro ${esc(ph)}).</p><input id="upin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN à 4 chiffres" style="text-align:center;font-size:20px"><div class="row" style="justify-content:center;margin-top:10px"><button class="pri" id="uok">Confirmer</button><button class="sec" id="uno">Annuler</button></div><pre class="note" id="ulog" style="text-align:left;white-space:pre-wrap"></pre></div>`;
  document.body.appendChild(d);
  d.querySelector("#uno").onclick=()=>{d.remove();no&&no()};
  d.querySelector("#uok").onclick=()=>{

<script>

function today(){return new Date().toISOString().slice(0,10)}
let S;try{S=JSON.parse(localStorage.getItem("pl2")||"null")}catch(e){S=null}S=S||seed();S.users=S.users||seed().users;S.me=S.me||{};S.brand=S.brand||seed().brand;if(!S.users.some(u=>u.role==="admin"))S.users.push(seed().users[2]);S.users.forEach(u=>{if(u.role!=="client"&&!u.momo){u.momo=u.phone;u.momoOp="Airtel Money"}});if(!S.init){S.init=1;["pharma","livreur","admin"].forEach(r=>{const u=S.users.find(x=>x.role===r);if(u)S.me[r]=u.id})}
function save(){try{localStorage.setItem("pl2",JSON.stringify(S))}catch(e){}DIRTY=true;if(SRV)push()}
function reset(){if(confirm("Effacer toutes les données de test ?")){S=seed();cart={};ocr=null;save();go("client")}}
let role="client",cart={},ocr=null,insured=false,lastSeen=0,tab="orders",cur=null,SRV=null,ADM="",editId=null,pend=null,ME=null,AUTH="login",CA=false,PM="auto",RS=null,AT="dash",DIRTY=false,GW=null;
const $=s=>document.querySelector(s),f=n=>n.toLocaleString("fr-FR")+" FCFA",esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function notif(to,msg){S.notifs.unshift({to,msg,t:new Date().toLocaleTimeString("fr-FR")});S.notifs=S.notifs.slice(0,30)}

 const B=S.brand,rs=document.documentElement.style;rs.setProperty("--g",B.c1);rs.setProperty("--gd",B.c2);if(!(typeof matchMedia==="function"&&matchMedia("(prefers-color-scheme: dark)").matches))rs.setProperty("--ink",B.c3);document.querySelector("header .mark").src=B.logo||LOGO;
 if(MH)document.body.appendChild(MH);
 $("#app").innerHTML=RS?resetView():role==="client"?(CA&&!ME?authView("client"):vClient()):ME?(role==="admin"?vAdmin():role==="pharma"?vPharma():vLivreur()):authView(role);

 const sb=$("#srv");sb.className="badge "+(SRV?(SRV.mode==="live"?"":"r"):"m");sb.textContent=SRV?"Serveur connecté ("+(SRV.mode==="live"?"paiements réels":"simulation")+")":"Mode démo";

 if(role==="client"&&cur)bindClient();

/* ---------- CLIENT ---------- */
function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=S.products.find(x=>x.id==id);return s+(insured?p.tm:p.price)*q},0)}
function vClient(){
 const mine=cur&&S.orders.find(o=>o.id===cur);
 if(mine)return vTrack(mine);
 const zi=+($("#zone")?.value||(ME&&ME.zone)||0),fee=Z[zi][1],prods=cartTotal(),ins=insured?200:0;
 return `<div class="banner">${mk(64)}<div><b>${esc(S.brand.title)}</b><br>${esc(S.brand.sub)}</div></div>${S.brand.promo?`<div class="card" style="border-color:var(--g);background:#16A34A14"><b>${esc(S.brand.promo)}</b></div>`:""}${ME?quick():""}
 <div class="card"><h2>1. Type de commande</h2><div class="row"><button class="${insured?"sec":"pri"}" onclick="insured=false;render()">Sans assurance</button><button class="${insured?"pri":"sec"}" onclick="insured=true;render()">Avec assurance</button></div>
 ${insured?`<div class="note" style="margin-top:8px">Vous payez le ticket modérateur. 200 FCFA de frais de dossier sont ajoutés.</div>
 <div class="row"><div class="grow"><label>Photo de l’ordonnance</label><div class="drop">Glisser une photo ici ou toucher pour l’ajouter<input type="file" accept="image/*" onchange="runOcr(this,'ord')"></div></div><div class="grow"><label>Carte d’assuré (CNAMGS, ASCOMA, SAHAM, OGAR)</label><div class="drop">Glisser une photo ici ou toucher pour l’ajouter<input type="file" accept="image/*" onchange="runOcr(this,'card')"></div></div><div class="grow"><label>CNI ou passeport</label><div class="drop">Glisser une photo ici ou toucher pour l’ajouter<input type="file" accept="image/*" onchange="runOcr(this,'id')"></div></div></div>
 <div id="ocrbox">${ocr?ocrHtml():'<div class="note">Ajoutez les 3 documents : les champs seront remplis automatiquement.</div>'}</div>`:""}</div>
 <div class="card"><h2>2. Produits</h2><div class="grid">${S.products.map(p=>`<div class="prod ${p.stock?"":"out"}"><span class="badge ${p.stock?"":"x"}" style="position:absolute;top:8px;right:8px">${p.stock?"Dispo":"Rupture"}</span><div class="ph">${pc(p)}</div><b>${esc(p.name)}</b><div class="note">${esc(p.cat)}</div><div>${f(insured&&p.tm?p.tm:p.price)}</div>${p.stock?`<div class="row" style="margin-top:6px"><button class="sec" onclick="qty(${p.id},-1)" aria-label="Retirer">−</button><b>${cart[p.id]||0}</b><button class="sec" onclick="qty(${p.id},1)" aria-label="Ajouter">+</button></div>`:'<span class="badge r">Rupture de stock</span>'}</div>`).join("")}</div></div>
 <div class="card"><h2>3. Livraison</h2><div class="row"><div class="grow"><label>Nom complet</label><input id="nm" value="${esc(ocr?.name||$("#nm")?.value||(ME&&ME.name)||"")}"></div><div class="grow"><label>Téléphone</label><input id="ph" inputmode="tel" placeholder="074 00 00 00" value="${esc($("#ph")?.value||(ME&&ME.phone)||"")}"></div></div>
 <label>Zone de livraison</label><select id="zone" onchange="render()">${Z.map((z,i)=>`<option value="${i}" ${i===zi?"selected":""}>Zone ${i+1} · ${z[0]} · ${f(z[1])}</option>`).join("")}</select>
 <label>Adresse précise</label><input id="adr" placeholder="Quartier, repère" value="${esc($("#adr")?.value||(ME&&ME.adr)||"")}">
 <label>Mode de paiement</label><div class="row"><button class="${PM==="auto"?"pri":"sec"}" onclick="PM='auto';render()">Automatique (CinetPay)</button><button class="${PM==="p2p"?"pri":"sec"}" onclick="PM='p2p';render()">Transfert direct (SMS)</button></div><label>Opérateur</label><select id="op">${["Airtel Money","Moov Money"].map(o=>`<option ${o===($("#op")?.value||(ME&&ME.op)||"Airtel Money")?"selected":""}>${o}</option>`).join("")}</select>
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row"><span class="grow">Caisse pharmacie (${insured?"ticket modérateur":"produits"}) : ${f(prods)}<br>Caisse livraison et service : ${f(fee+ins)}${insured?` (dont ${f(ins)} de frais de dossier)`:""}</span><span class="stat">${f(prods+fee+ins)}</span></div>
 <button class="pri" style="width:100%;margin-top:10px" ${prods?"":"disabled"} onclick="pay()">${PM==="p2p"?"Commander et recevoir les instructions":"Commander et payer"}</button></div>${ME?history():""}`;
}
function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render()}
function settle(o){const a=S.users.find(u=>u.role==="admin"),p=S.users.find(u=>u.role==="pharma");if(a)a.wallet=(a.wallet||0)+o.split.pl;if(p)p.wallet=(p.wallet||0)+o.split.pharm}
function markPaid(o,ref){o.status="paid";S.tx.unshift({t:new Date().toLocaleString("fr-FR"),id:o.id,op:o.op,total:o.total,...o.split,ref:ref||"TX"+Date.now().toString().slice(-7)});settle(o);notif("pharma",o.id+" : paiement reçu, à préparer");notif("client","Paiement confirmé \u2022 "+o.id);save();render()}
async function pushPay(id){const o=S.orders.find(x=>x.id===id);
 o.status="push";notif("client",id+" \u2022 demande de paiement reçue sur votre téléphone");save();render();
 if(!SRV)return;
 try{let r=await fetch(API+"/api/paiements",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({operateur:/moov/i.test(o.op)?"moov":"airtel",telephone:o.phone,produits:o.prods,fraisZone:o.fee,assurance:!!o.insured,code:o.id})});
  let p=await r.json();if(!r.ok)throw new Error(p.erreur||"refusé");
  if(p.urlPaiement){o.payUrl=p.urlPaiement;save();render()}
  for(let i=0;i<100&&p.statut==="EN_ATTENTE";i++){await new Promise(s=>setTimeout(s,3000));p=await(await fetch(API+"/api/paiements/"+p.id)).json()}
  if(p.statut==="REUSSI")return markPaid(o,p.refOperateur);
  throw new Error(p.erreur||"paiement non confirmé")
 }catch(e){o.status="new";save();alert("Push non abouti : "+e.message);render()}}
function payUssd(id){const o=S.orders.find(x=>x.id===id);if(o&&o.status==="push")ussd(o.op,o.phone,o.total,()=>markPaid(o),()=>{o.status="new";o.shown=false;notif("pharma",id+" : paiement refusé par le client");save();render()})}
function pushCard(o){return `<div class="card" style="border-color:var(--g)"><span class="badge r">Paiement à valider</span><p>Demande de ${f(o.total)} envoyée au ${esc(o.phone)} (${esc(o.op)}).</p>${o.payUrl?`<a class="pri" style="display:inline-block;text-decoration:none;padding:10px 16px;border-radius:8px;color:#fff" href="${esc(o.payUrl)}" target="_blank" rel="noopener">Ouvrir la page de paiement</a>`:SRV?'<p class="note">Validez sur votre téléphone.</p>':`<button class="pri" onclick="payUssd('${o.id}')">Ouvrir la demande USSD</button>`}</div>`}
function ussd(op,ph,amt,ok,no){const m=/moov/i.test(op),d=document.createElement("div");d.className="ov";d.id="ussd";
 d.innerHTML=`<div class="modal"><span class="badge" style="background:${m?"#0057B8":"#E4002B"}">${esc(op)}</span><div class="spin"></div><h3>Demande de paiement reçue</h3><p>PHARMALIV demande <b>${f(amt)}</b>. Entrez votre code PIN ${esc(op)} pour valider (numéro ${esc(ph)}).</p><input id="upin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN à 4 chiffres" style="text-align:center;font-size:20px"><div class="row" style="justify-content:center;margin-top:10px"><button class="pri" id="uok">Valider le paiement</button><button class="sec" id="uno">Refuser</button></div><pre class="note" id="ulog" style="text-align:left;white-space:pre-wrap"></pre></div>`;
 document.body.appendChild(d);d.querySelector("#uno").onclick=()=>{d.remove();no&&no()};
 d.querySelector("#uok").onclick=()=>{if(!/^\d{4}$/.test(d.querySelector("#upin").value))return alert("Le PIN doit avoir 4 chiffres.");d.querySelector("#ulog").textContent="Webhook "+(m?"Moov":"Airtel")+" : paiement confirmé";d.querySelector(".spin").outerHTML='<div class="ok">✅</div>';setTimeout(()=>{d.remove();ok()},1100)}}
function walletCard(){return `<div class="card"><h2>Mon solde</h2><div class="row"><span class="stat">${f(ME.wallet||0)}</span><button class="pri" ${ME.wallet?"":"disabled"} onclick="payout()">Retirer vers mon Mobile Money (${esc(ME.momoOp||"")} ${esc(ME.momo||"")})</button></div></div>`}
async function payout(){const u=ME,amt=u.wallet||0;if(!amt)return alert("Aucun solde à retirer.");if(!u.momo)return alert("Ajoutez votre numéro Mobile Money.");
 if(SRV){if(!ADM)ADM=prompt("Clé admin du serveur (ADMIN_KEY) :")||"";if(!ADM)return;
  try{const r=await fetch(API+"/api/retraits",{method:"POST",headers:{"Content-Type":"application/json","x-cle-admin":ADM},body:JSON.stringify({operateur:/moov/i.test(u.momoOp)?"moov":"airtel",telephone:u.momo,montant:amt,motif:"retrait "+u.role})});const j=await r.json();if(r.status===401)ADM="";if(!r.ok)throw new Error(j.erreur||"Refusé")}catch(e){return alert("Retrait non envoyé : "+e.message)}}
 S.wd.unshift({who:u.name,id:Date.now(),t:new Date().toLocaleString("fr-FR"),op:u.momoOp,tel:u.momo,amt,st:"envoye",ref:SRV?"SERVEUR":"SIMULATION"});u.wallet=0;notif(u.role,"Retrait de "+f(amt)+" envoyé vers "+u.momoOp+" "+u.momo);save();render()}
function wm(u,code){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const x=c.getContext("2d");x.drawImage(im,0,0);x.fillStyle="rgba(22,101,52,.35)";x.font="bold "+Math.max(14,im.width/14)+"px sans-serif";x.rotate(-.35);const t=code+" "+new Date().toLocaleString("fr-FR")+" PHARMALIV";for(let y=0;y<im.height*1.6;y+=Math.max(40,im.width/6))x.fillText(t,-im.width*.2,y);res(c.toDataURL("image/jpeg",.7))};im.onerror=()=>res(u);im.src=u})}
function wmOrder(o){if(o.ocr&&o.ocr.imgs)Object.keys(o.ocr.imgs).forEach(k=>wm(o.ocr.imgs[k],o.id).then(n=>{o.ocr.imgs[k]=n;o.ocr.wm=1;save()}))}
function saveNum(id){const o=S.orders.find(x=>x.id===id);o.ocr.num=$("#ni"+id.slice(1)).value.trim();o.ocr.numOk=true;save();render()}
function resetView(){const r=RS,t={client:"Client",pharma:"Pharmacie",livreur:"Livreur",admin:"Administrateur"}[r.role];
 const base=`<div class="card" style="max-width:420px;margin:0 auto"><div style="text-align:center">${mk(56)}<h2>Code oublié : ${t}</h2></div><label for="rp">Téléphone du compte</label><input id="rp" inputmode="tel" placeholder="074 00 00 00" value="${esc(r.phone||"")}"><button class="pri" style="width:100%;margin-top:10px" onclick="rs1()">Envoyer le code par SMS</button><button class="sec" style="width:100%;margin-top:8px" onclick="RS=null;render()">Retour à la connexion</button></div>`;
 if(r.step===1)return base;

const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const dest=o=>{const z=GPS.z[o.zone],k=(parseInt(o.id.slice(2))%5)-2;return[z[0]+k*.0015,z[1]-k*.0012]};
function route(o){const k=o.id+"|"+o.zone;if(ROUTES[k])return ROUTES[k];const a=GPS.ph,b=dest(o),km=hav(a,b)*1.3;
 ROUTES[k]={pts:[a,b],dur:km/35*3600,km,real:false};
 if(LM)fetch("https://router.project-osrm.org/route/v1/driving/"+a[1]+","+a[0]+";"+b[1]+","+b[0]+"?overview=full&geometries=geojson").then(r=>r.json()).then(j=>{const x=j.routes&&j.routes[0];if(x){ROUTES[k]={pts:x.geometry.coordinates.map(c=>[c[1],c[0]]),dur:x.duration,km:x.distance/1000,real:true};render()}}).catch(()=>{});
 return ROUTES[k]}
function posAt(pts,p){const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+hav(pts[i-1],pts[i]));const t=d[d.length-1]*p;for(let i=1;i<pts.length;i++)if(t<=d[i]){const u=(t-d[i-1])/((d[i]-d[i-1])||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*u,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*u]}return pts[pts.length-1]}

 <button class="sec" style="margin-top:10px" onclick="$('#exp').value=['heure;code;operateur;total;livreur;pharmaliv;pharmacie;ref'].concat(S.tx.map(t=>[t.t,t.id,t.op,t.total,t.liv,t.pl,t.pharm,t.ref].join(';'))).join('\\n')">Exporter pour la comptabilité</button><textarea id="exp" rows="4" style="margin-top:8px"></textarea></div>
 ${verifCard()}<div class="card"><h2>Carte globale</h2>${mapJobs(S.orders.filter(o=>["ready","delivering"].includes(o.status)),"Carte globale")}</div><div class="card"><h2>Retraits (historique)</h2><div class="scroll"><table><tr><th>Date</th><th>Opérateur</th><th>Numéro</th><th>Montant</th><th>État</th></tr>${S.wd.map(w=>`<tr><td>${esc(w.t)} ${esc(w.who||"")}</td><td>${esc(w.op)}</td><td>${esc(w.tel||"")}</td><td>${f(w.amt)}</td><td>${w.st==="demande"?`<button class="pri" onclick="payWd(${w.id})">Valider et envoyer</button>`:'<span class="badge">Envoyé</span>'}</td></tr>`).join("")||'<tr><td colspan="5" class="note">Aucune demande de retrait.</td></tr>'}</table></div></div><div class="card"><h2>Partenaires</h2><div class="scroll"><table><tr><th>Nom</th><th>Type</th><th>Contrôle</th></tr>${S.users.filter(u=>u.role!=="client").map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role==="pharma"?"Pharmacie":"Livreur"}</td><td><span class="badge">Inscrit</span></td></tr>`).join("")}</table></div><p class="note">Clients inscrits : ${S.users.filter(u=>u.role==="client").length}. Retraits envoyés : ${S.wd.filter(w=>w.st!=="demande").length}</p></div>`}
